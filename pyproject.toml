[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stillwright"
version = "0.1.0"
description = "State keeper CLI (sw) for the Stillwright agent skills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Hamza Ilyas"}]

[project.urls]
Homepage = "https://github.com/HamzaIlyas/stillwright"

[project.scripts]
sw = "sw:main"

[tool.setuptools]
py-modules = ["sw"]
package-dir = {"" = "skills/stillwright/scripts"}
