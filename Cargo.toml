[package]
name = "stillwright"
version = "0.1.4"
edition = "2021"
rust-version = "1.89"
description = "State keeper (sw) for the Stillwright agent skills: goals, runs, inbox, dated notes, hash-pinned tools"
license = "MIT"
repository = "https://github.com/HamzaIlyas/stillwright"
homepage = "https://github.com/HamzaIlyas/stillwright"
readme = "README.md"
keywords = ["agent", "orchestrator", "ai", "skills", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "sw"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
